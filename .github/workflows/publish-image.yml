name: publish-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          docker buildx build --build-context kit=./vendor/kit \
            --label org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-turnos \
            --annotation org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-turnos \
            --annotation index:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-turnos \
            --annotation manifest:org.opencontainers.image.source=https://github.com/Opus-Perpetuus/imperium-subject-turnos \
            -t ghcr.io/opus-perpetuus/subject-turnos:0.1.0 \
            -t ghcr.io/opus-perpetuus/subject-turnos:latest \
            --push \
            .
          docker push ghcr.io/opus-perpetuus/subject-turnos:0.1.0
          docker push ghcr.io/opus-perpetuus/subject-turnos:latest
